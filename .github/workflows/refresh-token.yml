name: 5 · Renovar token de Instagram

# El token dura 60 días; se renueva cada semana para que nunca venza.
# Necesita el secreto GH_PAT (ver SETUP.md, paso 6).
on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Renovar y guardar el token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secreto GH_PAT. Sin él el token de Instagram vencerá en 60 días (ver SETUP.md)."
            exit 1
          fi
          pip install -q requests
          python scripts/refresh_token.py "$RUNNER_TEMP/token.txt"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token.txt"
          shred -u "$RUNNER_TEMP/token.txt"
          echo "Secreto IG_ACCESS_TOKEN actualizado."
