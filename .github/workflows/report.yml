name: 4 · Informe semanal

on:
  schedule:
    - cron: "0 21 * * 0"   # domingo 21:00 UTC (18:00 en Chile en verano)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria de la bandeja (solo conteos)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: inbox-state-${{ github.run_id }}
          restore-keys: inbox-state-

      - name: Generar informe
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          pip install -q requests
          python scripts/weekly_report.py

      - name: Guardar informe
        run: |
          git config user.name "ig-autopilot"
          git config user.email "ig-autopilot@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "informe semanal"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
