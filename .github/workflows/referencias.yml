name: 8 · Estudiar cuentas de referencia

# Al cambiar pruebas/referencias/pedido.json: baja publicaciones públicas (API oficial) y las guarda cifradas.
on:
  push:
    branches: [main]
    paths: ["pruebas/referencias/pedido.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  estudiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Descargar y cifrar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python scripts/referencias.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pruebas/referencias
          git commit -m "Referencias cifradas" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
