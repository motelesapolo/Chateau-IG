name: 6 · Preparar material subido

# Se ejecuta cuando subes fotos o videos a material/: convierte, achica y borra metadatos (GPS, etc.).
on:
  push:
    branches: [main]
    paths: ["material/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  material:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q Pillow pillow-heif

      - name: Preparar fotos y videos
        run: python scripts/material.py optimizar

      - name: Guardar
        run: |
          git config user.name "ig-autopilot"
          git config user.email "ig-autopilot@users.noreply.github.com"
          git add -A material
          if git diff --cached --quiet; then echo "Nada nuevo"; exit 0; fi
          git commit -qm "material: fotos y videos preparados"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
