name: 1 · Renderizar contenido

# Se ejecuta cuando Claude sube el lote semanal a una rama claude/... (o cuando editas la cola en main).
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar git
        run: |
          git config user.name "ig-autopilot"
          git config user.email "ig-autopilot@users.noreply.github.com"

      - name: Traer la cola que subió Claude
        if: github.ref_name != 'main'
        run: |
          git fetch origin "$BRANCH"
          python scripts/ingest_branch.py "origin/$BRANCH"

      - name: ¿Hay algo que renderizar?
        id: todo
        run: |
          n=$(python -c "import json,glob; print(sum(json.load(open(p)).get('status','planned')=='planned' for p in glob.glob('queue/*.json')))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "Publicaciones por renderizar: $n"

      - name: Instalar herramientas
        if: steps.todo.outputs.pending != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Renderizar
        if: steps.todo.outputs.pending != '0'
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: python scripts/render_queue.py

      - name: Guardar cambios en main
        run: |
          git add -A queue media assets
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "render: cola actualizada"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Borrar la rama de Claude ya incorporada
        if: github.ref_name != 'main' && success()
        run: git push origin --delete "$BRANCH" || true
