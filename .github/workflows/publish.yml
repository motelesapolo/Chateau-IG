name: 2 · Publicar a su hora

on:
  schedule:
    # GitHub atrasa mucho los horarios "redondos": se usan minutos desplazados.
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
    paths: ["queue/**", "publicar/**"]   # publicar al instante si cambia la cola (o con un "toque")
  workflow_run:
    workflows: ["1 · Renderizar contenido"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar lo que corresponde
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install -q requests
          python scripts/publish_due.py

      - name: Guardar cambios en main
        run: |
          git config user.name "ig-autopilot"
          git config user.email "ig-autopilot@users.noreply.github.com"
          git add -A queue published
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "publicado: $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
