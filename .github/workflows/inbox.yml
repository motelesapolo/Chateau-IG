name: 3 · Responder comentarios y DMs

# Los logs de un repo público son públicos: el script solo registra conteos, nunca textos.
on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria de la bandeja
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: inbox-state-${{ github.run_id }}
          restore-keys: inbox-state-

      - name: Atender la bandeja
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          pip install -q requests
          python scripts/inbox.py

      - name: Guardar memoria de la bandeja
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: inbox-state-${{ github.run_id }}
